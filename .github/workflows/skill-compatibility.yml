name: Skill portability
on:
  pull_request:
    paths:
      - '.agents/skills/lab-*/**'
      - '.github/workflows/skill-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    name: ${{ matrix.os }} Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.9'
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core evidence and review invariants
        run: python .agents/skills/lab-weekly-flow/scripts/test_learning_flow.py
      - name: Native CLI installation, UTF-8, CRLF and approval roundtrip
        run: python .agents/skills/lab-weekly-flow/scripts/test_portable_cli.py
      - name: Bidirectional delivery, exact read receipts and offline retry
        run: python .agents/skills/lab-weekly-flow/scripts/test_collaboration_flow.py
      - name: Learning-only current-turn capture and history exclusion
        run: python .agents/skills/lab-weekly-flow/scripts/test_auto_capture.py
      - name: Media queue leases, packet hashes, retries and private paths
        run: python .agents/skills/lab-weekly-flow/scripts/test_media_queue.py
      - name: Full audio coverage, segment resume and adapter failure
        run: python .agents/skills/lab-weekly-flow/scripts/test_media_transcribe.py
