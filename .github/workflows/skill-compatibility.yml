name: Skill portability
on:
  pull_request:
    paths:
      - '.agents/skills/lab-*/**'
      - '.github/workflows/skill-compatibility.yml'
  push:
    branches: ['fix/learning-skills-windows-review']
    paths:
      - '.agents/skills/lab-*/**'
      - '.github/workflows/skill-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    name: ${{ matrix.os }} Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.9'
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core evidence and review invariants
        run: python .agents/skills/lab-weekly-flow/scripts/test_learning_flow.py
      - name: Native CLI installation, UTF-8, CRLF and approval roundtrip
        run: python .agents/skills/lab-weekly-flow/scripts/test_portable_cli.py
